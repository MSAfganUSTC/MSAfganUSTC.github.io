# Site Settings
locale: "en-US"
site_theme: "default"
title: "Muhammad Sher Afgan"
title_separator: "-"
name: &name "Muhammad Sher Afgan"
description: &description "Computer Vision and Generative AI Researcher"
url: "https://msafganustc.github.io"
baseurl: ""
repository: "MSAfganUSTC/MSAfganUSTC.github.io"

author:
  avatar           : "profile.png"
  bio              : "Computer Vision & Generative AI Researcher | Machine Learning & Deep Learning"
  location         : "Hefei, China"
  employer         : "University of Science and Technology of China (USTC)"
  uri              : "https://msafganustc.github.io"
  email            : "msafgan@mail.ustc.edu.cn"
  phone            : "+86 13083402573"

  # Academic websites
  googlescholar    : "https://scholar.google.com.pk/citations?hl=en&user=EYOfbFOZuxcC"
  orcid            : "https://orcid.org/0000-0002-0925-1557"
  ssrn             : "https://papers.ssrn.com/Sol3/Cf_Dev/AbsByAuth.cfm?per_id=7429663"
  scopus           : "https://www.scopus.com/authid/detail.uri?authorId=57195982653"  

  # Repositories and software development
  github           : "MSAfganUSTC"
  whatsapp         : "/images/whatsapp-qr.png"
  wechat           : "/images/wechat-qr.png"

publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider:

atom_feed:
  hide: false

twitter:
  username: "MSAfganUSTC"

social:
  type: "Person"
  name: "Muhammad Sher Afgan"
  links:
    - "https://github.com/MSAfganUSTC"
    - "https://orcid.org/0000-0002-0925-1557"

analytics:
  provider: "false"

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
